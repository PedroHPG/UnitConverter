<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <!--This is a comment. Comments are not displayed in the browser-->

        <!--TITLE-->
        <h1>Unit Converter - Conversor De Unidades</h1>

        <!--INSTRUCTIONS-->
        <p>First, select the type of unit you want to convert: weight, length, distance or temperature</p>
        <p>Then, select the unit you have, and the one you want to convert it into</p>
        <p>Type the value and hit CONVERT</p>
        <p>To swap the units you're converting between, hit SWAP</p>

        <!--Selector for type of units-->
        <div class="dropdown">
            <select name="UnitTypeMenu" id="unitTypeMenu">
                <option value="1">Weight</option>
                <option value="2">Length</option>
                <option value="3">Distance</option>
                <option value="4">Temperature</option>
            </select>
        </div>
        <!--The selectors below will be hidden or revealed based on the selected type-->
        <form>
            <!--WEIGHT UNITS-->
            <!--Selector for unit 1-->
            <div class="dropdown weight">
                <select name="WeightInputMenu" id="weightInputMenu" class="unit-choice">
                    <option value="kg">kg</option>
                    <option value="lbs">lbs</option>
                </select>
            </div>
            <!--Text field to enter unit 1 value-->
            <div class="form-group">
                <label for="weightInput">Weight</label>
                <input type="number" class="form-control input-value" id="weightInput" placeholder="Weight">
            </div>
            <!--Selector for unit 2-->
            <div class="dropdown weight">
                <select name="WeightOutputMenu" id="weightOutputMenu" class="unit-choice">
                    <option value="kg">kg</option>
                    <option value="lbs">lbs</option>
                </select>
            </div>
            <!--Return value in unit 2-->
            <label for="weight-result">Converted Value:</label>
            <input class="form-control" id="weight-result" type="text" placeholder="Value" readonly>

            <!--LENGTH UNITS-->
            <!--Selector for unit 1-->
            <div class="dropdown length">
                <select name="LengthInputMenu" id="lenghtInputMenu" class="unit-choice">
                    <option value="cm">cm</option>
                    <option value="inch">inch</option>
                    <option value="meter">meter</option>
                    <option value="yard">yard</option>
                </select>
            </div>
            <!--Text field to enter unit 1 value-->
            <div class="form-group">
                <label for="lengthInput">Length</label>
                <input type="number" class="form-control input-value" id="lengthInput" placeholder="Length">
            </div>
            <!--Selector for unit 2-->
            <div class="dropdown length">
                <select name="LengthOutputMenu" id="lenghtOutputMenu" class="unit-choice">
                    <option value="cm">cm</option>
                    <option value="inch">inch</option>
                    <option value="meter">meter</option>
                    <option value="yard">yard</option>
                </select>
            </div>
            <!--Return value in unit 2-->
            <label for="length-result">Converted Value:</label>
            <input class="form-control" id="length-result" type="text" placeholder="Value" readonly>

            <!--DISTANCE UNITS-->
            <!--Selector for unit 1-->
            <div class="dropdown distance">
                <select name="DistanceInputMenu" id="DistanceInputMenu" class="unit-choice">
                    <option value="km">km</option>
                    <option value="mile">mile</option>
                </select>
            </div>
            <!--Text field to enter unit 1 value-->
            <div class="form-group">
                <label for="distanceInput">Distance</label>
                <input type="number" class="form-control input-value" id="distanceInput" placeholder="Distance">
            </div>
            <!--Selector for unit 2-->
            <div class="dropdown distance">
                <select name="DistanceOutputMenu" id="DistanceOutputMenu" class="unit-choice">
                    <option value="km">km</option>
                    <option value="mile">mile</option>
                </select>
            </div>
            <!--Return value in unit 2-->
            <label for="distance-result">Converted Value:</label>
            <input class="form-control" id="distance-result" type="text" placeholder="Value" readonly>

            <!--TEMPERATURE UNITS-->
            <!--Selector for unit 1-->
            <div class="dropdown temperature">
                <select name="TemperatureInputMenu" id="TemperatureInputMenu" class="unit-choice">
                    <option value="Celsius">Celsius</option>
                    <option value="Fahrenheit">Fahrenheit</option>
                    <option value="Kelvin">Kelvin</option>
                </select>
            </div>
            <!--Text field to enter unit 1 value-->
            <div class="form-group">
                <label for="temperatureInput">Temperature</label>
                <input type="number" class="form-control input-value" id="temperatureInput" placeholder="Temperature">
            </div>
            <!--Selector for unit 2-->
            <div class="dropdown temperature">
                <select name="TemperatureOutputMenu" id="TemperatureOutputMenu" class="unit-choice">
                    <option value="Celsius">Celsius</option>
                    <option value="Fahrenheit">Fahrenheit</option>
                    <option value="Kelvin">Kelvin</option>
                </select>
            </div>
            <!--Return value in unit 2-->
            <label for="temperature-result">Converted Value:</label>
            <input class="form-control" id="temperature-result" type="text" placeholder="Value" readonly>

            <!--CONVERT button-->
            <button type="submit" class="btn btn-primary">CONVERT</button>
            <!--SWAP button-->
            <button type="submit" class="btn btn-primary">SWAP</button>
        </form>
        <!--Error messages to be displayed if user does something wrong-->

        <script src="index.js"></script>
        <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
    </body>

</html>
